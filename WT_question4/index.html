<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- Header -->

        <header>

            <p class="subject">
                WEB TECHNOLOGY
            </p>

            <h1>
                Student Grade Calculator
            </h1>

            <p>
                Enter marks for five subjects to calculate
                the total, average, grade and result.
            </p>

        </header>



        <!-- Grade Form -->

        <main>

            <form id="gradeForm">


                <div class="subjects">


                    <!-- Subject 1 -->

                    <div class="subject-box">

                        <label for="subject1">
                            Web Technology
                        </label>

                        <input type="number" id="subject1" min="0" max="100" placeholder="Enter marks" required>

                    </div>


                    <!-- Subject 2 -->

                    <div class="subject-box">

                        <label for="subject2">
                            Database Management
                        </label>

                        <input type="number" id="subject2" min="0" max="100" placeholder="Enter marks" required>

                    </div>


                    <!-- Subject 3 -->

                    <div class="subject-box">

                        <label for="subject3">
                            Computer Networks
                        </label>

                        <input type="number" id="subject3" min="0" max="100" placeholder="Enter marks" required>

                    </div>


                    <!-- Subject 4 -->

                    <div class="subject-box">

                        <label for="subject4">
                            Operating Systems
                        </label>

                        <input type="number" id="subject4" min="0" max="100" placeholder="Enter marks" required>

                    </div>


                    <!-- Subject 5 -->

                    <div class="subject-box">

                        <label for="subject5">
                            Java Programming
                        </label>

                        <input type="number" id="subject5" min="0" max="100" placeholder="Enter marks" required>

                    </div>

                </div>



                <!-- Buttons -->

                <div class="buttons">

                    <button type="submit">
                        Calculate Result
                    </button>

                    <button type="reset" class="reset">
                        Clear
                    </button>

                </div>

            </form>



            <!-- Error Message -->

            <p id="error"></p>



            <!-- Result -->

            <section id="result" class="result hidden">

                <h2>
                    Result
                </h2>


                <div class="result-grid">


                    <div class="result-box">

                        <span>
                            Total
                        </span>

                        <strong id="total">
                            0
                        </strong>

                        <small>
                            out of 500
                        </small>

                    </div>


                    <div class="result-box">

                        <span>
                            Average
                        </span>

                        <strong id="average">
                            0
                        </strong>

                        <small>
                            percentage
                        </small>

                    </div>


                    <div class="result-box">

                        <span>
                            Grade
                        </span>

                        <strong id="grade">
                            -
                        </strong>

                        <small>
                            overall grade
                        </small>

                    </div>


                    <div class="result-box">

                        <span>
                            Status
                        </span>

                        <strong id="status">
                            -
                        </strong>

                        <small>
                            Pass / Fail
                        </small>

                    </div>

                </div>


                <div class="message">

                    <p id="message"></p>

                </div>

            </section>

        </main>

    </div>


    <footer>

        <p>
            Student Grade Calculator | Web Technology Assignment
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
